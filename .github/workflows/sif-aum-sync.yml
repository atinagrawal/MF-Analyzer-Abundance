name: Monthly SIF AUM Sync

on:
  schedule:
    # Run on the 15th of every month at 05:00 UTC -- staggered two hours
    # after the AMFI AUM sync (03:00) and one hour after the scheme
    # riskometer sync (04:00) so the three workflows don't hit AMFI's site
    # concurrently. SIF Average AUM is a quarterly disclosure, but the exact
    # publish day isn't documented, so a monthly run (matching this
    # project's other AMFI syncs) picks up a new quarter within 15 days.
    - cron: '0 5 15 * *'
  workflow_dispatch:

jobs:
  sync-sif-aum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install aws4fetch --no-save

      - name: Run SIF AUM Sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/sync_sif_aum.js
