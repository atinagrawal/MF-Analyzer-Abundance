name: Monthly SIF AUM Sync

on:
  schedule:
    # Run on the 5th, 7th, 10th and 15th of every month at 05:00 UTC --
    # staggered two hours after the AMFI AUM sync (03:00) and one hour
    # after the scheme riskometer sync (04:00) so the three workflows
    # don't hit AMFI's site concurrently. SIF Average AUM is a quarterly
    # disclosure with no documented publish day -- confirmed live (2026-10)
    # that AMFI can have the new quarter ready well before the 15th, so
    # checking earlier catches it sooner instead of always waiting for the
    # last scheduled day. The script itself (sync_sif_aum.js) skips the
    # live AMFI fetch entirely once an earlier run this cycle already
    # picked up the current quarter, so the extra scheduled days cost
    # nothing once the new data has already been found.
    - cron: '0 5 5,7,10,15 * *'
  workflow_dispatch:

jobs:
  sync-sif-aum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install aws4fetch --no-save

      - name: Run SIF AUM Sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/sync_sif_aum.js
