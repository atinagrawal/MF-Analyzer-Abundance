name: Monthly AMFI AUM Sync

on:
  schedule:
    # Run on the 15th of every month at 03:00 UTC. The underlying
    # Average_AUM_For_The_Quarter figure itself only changes 4x/year, but
    # the exact day AMFI publishes each new quarter isn't documented, so a
    # monthly run (rather than trying to time a quarterly one precisely)
    # guarantees the new quarter's figure is picked up within 15 days of
    # publication instead of risking up to 3 months of staleness. The 15th
    # was chosen as a safe buffer -- AMFI is expected to have published by
    # then. Re-running on an unchanged quarter is harmless (idempotent).
    - cron: '0 3 15 * *'
  workflow_dispatch:

jobs:
  sync-amfi-aum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install aws4fetch --no-save

      - name: Run AMFI AUM Sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/sync_amfi_aum.js
