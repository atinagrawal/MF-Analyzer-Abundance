name: bse-index-dashboard

# Nightly: fetch all ~141 BSE indices (returns + P/E, P/B, Div. Yield) into
# bse_index_dashboard, so the Indices page can merge BSE alongside NSE.
#
# Scheduled trigger disabled 2026-10-30: same BSE/Akamai GitHub-Actions-IP
# block described in bse-index-cache-sync.yml -- see that workflow's
# comment and scripts/run-bse-sync-local.ps1. Kept manual-trigger-only as
# a fallback.
on:
  workflow_dispatch:

concurrency:
  group: bse-index-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install pg@8 --no-save
      - name: Build BSE index dashboard
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/build-bse-index-dashboard.mjs
