name: Precious Metals Daily Snapshot

# Stores one row/day of Gold/Silver/Platinum rates for a future trend
# chart on /gold-silver-rates -- see scripts/snapshot-precious-metals.mjs.
# Unlike bse-index-cache-sync.yml, this upstream feed has shown no sign
# of blocking cloud/datacenter IPs, so it runs here directly (no
# local-machine workaround needed).
on:
  schedule:
    # 00:00 UTC = 05:30 IST. GitHub's scheduler has been observed to fire
    # this workflow 6-11h late (seen 18:08-22:50 UTC against this cron's
    # old 11:30 UTC slot) -- scheduling at 05:30 IST instead of 17:00 IST
    # leaves ~18h of runway before the next IST-midnight boundary, so even
    # a similarly large delay can't push the run into the wrong calendar
    # day and silently skip one (as happened for 2026-11-22).
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install cheerio pg@8 --no-save

      - name: Snapshot precious metals rates
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/snapshot-precious-metals.mjs
