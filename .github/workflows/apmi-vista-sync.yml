name: Monthly APMI VISTA PMS Compliance Sync

on:
  schedule:
    # Staggered monthly polling: 5th, 7th, 10th, 12th, 15th, and 20th of every month at 04:30 UTC (10:00 AM IST).
    # Script uses an early-exit guard (< 100ms) once that month's compliance data is already ingested,
    # ensuring zero wasted downloads of the ~38 MB payload on subsequent scheduled days.
    - cron: '30 4 5,7,10,12,15,20 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync (bypasses early-exit guard and re-syncs all months)'
        required: false
        default: false
        type: boolean

jobs:
  sync-apmi-vista:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install pg aws4fetch --no-save

      - name: Run APMI VISTA Sync
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/sync_apmi_vista.mjs --force
          else
            node scripts/sync_apmi_vista.mjs
          fi
