name: Daily MF Scheme List Sync

on:
  schedule:
    # Daily (unlike this project's other AMFI syncs, which are monthly --
    # AUM/risk-o-meter data is only disclosed monthly, but new mutual fund
    # scheme launches/renames can happen any day). 20:00 UTC = 1:30 AM IST,
    # well after AMFI's NAVAll.txt publishes for the day.
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync-mf-scheme-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install aws4fetch --no-save

      - name: Run MF Scheme List Sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/sync_mf_scheme_list.js
