name: Build MF Screener dataset

# Runs the heavy compute on GitHub Actions (free + unlimited for public repos,
# 6h job limit) — NOT on Vercel, whose Hobby functions are too short for the
# ~60 bulk fetches. The job upserts results into Postgres; Vercel just reads.

on:
  schedule:
    - cron: "30 2 * * *"     # ~08:00 IST daily (AMFI publishes NAVs by night)
  workflow_dispatch: {}        # allow manual run from the Actions tab

# Avoid overlapping runs
concurrency:
  group: screener
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        run: npm install pg@8

      - name: Build + upsert screener dataset
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}   # add in repo Settings → Secrets → Actions
          MONTHS: "60"
        run: node scripts/build-screener.mjs

      - name: Build + upsert SIF screener dataset
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/build-sif-screener.mjs

      - name: Fetch + upsert monthly stress test data
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/fetch-stress-test.mjs

      # Without this, /api/screener and /api/sif-nav's build-time ISR
      # snapshot can keep serving stale/pre-outage data for up to 6h after
      # a successful run, even though Postgres is already correct — see
      # app/api/revalidate/route.js. Only reached if every step above
      # succeeded (a guard abort above skips this, on purpose).
      - name: Revalidate live site cache
        run: |
          curl -sf -X POST "https://mfcalc.getabundance.in/api/revalidate" \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}"

      # Optional artifact for debugging / a static fallback
      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-json
          path: data/screener.json
          retention-days: 7
          if-no-files-found: ignore

      # Funds where mfapi.in oldest NAV >> 10 (pre-AMFI-records) — add overrides
      # to data/mf-inception-overrides.json to get accurate since-inception returns
      - name: Upload inception needs-review list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-inception-needs-review
          path: data/mf-inception-needs-review.json
          retention-days: 30
          if-no-files-found: ignore
