name: BSE Index Cache Sync

# Keeps the benchmark-chart data warm (fund/SIF detail pages, Rolling
# Returns, PMS compare modal alpha lookups) by fetching BSE's index symbol
# list + every index's full daily history from a GitHub Actions runner and
# writing it to R2, since api.bseindia.com now blocks Vercel's production
# IPs (see lib/bseIndex.js's header comment for the full story) -- the
# live routes read this cache instead of calling BSE directly.
#
# Scheduled trigger disabled 2026-10-30: BSE's Akamai WAF started blocking
# GitHub Actions' runner IPs too (403 on every run since 2026-10-28), the
# same block it already applied to Vercel's IPs earlier in October. The
# daily sync now runs from a Windows Scheduled Task on a normal
# office/home network instead -- see scripts/run-bse-sync-local.ps1. This
# workflow is kept, manual-trigger-only, as a fallback for whenever BSE's
# block criteria changes again.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only sync the first N indices (smoke test) -- leave blank for all'
        required: false

concurrency:
  group: bse-index-cache-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install aws4fetch --no-save

      - name: Sync BSE index cache
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/sync_bse_index_cache.js --limit=${{ github.event.inputs.limit }}
          else
            node scripts/sync_bse_index_cache.js
          fi
