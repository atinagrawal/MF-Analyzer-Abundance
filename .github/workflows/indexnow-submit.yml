name: Bing SEO & GEO Automation (IndexNow, Priority Submit, Telemetry)

# Automates Bing SEO and Generative Engine Optimization (GEO):
# 1. Pings IndexNow (api.indexnow.org & bing.com/indexnow) with every URL across all 6 sitemaps.
# 2. Uses Bing Webmaster Tools REST API to submit daily priority URLs up to quota (SubmitUrlbatch).
# 3. Synchronizes sitemap feeds in Bing Webmaster Tools.
# 4. Pulls crawl diagnostics and search performance telemetry (GetCrawlStats, GetQueryStats).
#
# Runs after screener.yml's nightly rebuild so the submitted URLs reflect that day's refreshed NAVs/returns.
on:
  schedule:
    - cron: '15 20 * * *'   # 20:15 UTC daily (~1:45 AM IST), ~105 min after screener.yml
  workflow_dispatch:

concurrency:
  group: bing-seo-geo-automation
  cancel-in-progress: false

jobs:
  bing-seo-geo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Submit All Sitemap URLs to IndexNow (Batch Fan-Out)
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/submit_indexnow.js

      - name: Submit Priority URLs & Sync Feeds to Bing Webmaster Tools API
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing_priority_submit.mjs

      - name: Collect Bing Search & Crawl Diagnostics Telemetry
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing_telemetry.mjs

