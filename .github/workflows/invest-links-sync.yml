name: Daily AMC Invest-Link Sync

on:
  schedule:
    # Mirrors amfi-nfo-sync.yml's daily cadence -- a new scheme from a
    # provider AMC (see scripts/sync_invest_links.js's PROVIDERS) can show
    # up on their portal any day, often while still in its NFO window.
    - cron: '15 4 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_invest_links.js'
      - '.github/workflows/invest-links-sync.yml'
  workflow_dispatch:

jobs:
  sync-invest-links:
    runs-on: ubuntu-latest
    # The HDFC/CAMS provider (scripts/lib/camsLinkGenerator.js) drives a
    # real headless browser through ~95 schemes, each its own ARN-search
    # round trip -- comfortably over the other sync workflows' usual
    # couple of minutes, but new/already-linked schemes are cheap (reused
    # without touching the browser at all -- see that file's header).
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install aws4fetch puppeteer --no-save

      - name: Run invest-link sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/sync_invest_links.js

      - name: Revalidate live site cache
        continue-on-error: true
        run: |
          curl -sf -X POST "https://mfcalc.getabundance.in/api/revalidate" \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" || true
